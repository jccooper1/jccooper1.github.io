# for details on settings, see https://docs.rendercv.com/user_guide/structure_of_the_yaml_input_file/#rendercv_settings-field
# (format for rendercv 2.2, pinned in requirements.txt)
rendercv_settings:
  render_command:
    # Paths are relative to the repository root
    design: assets/rendercv/design.yaml
    pdf_path: assets/rendercv/rendercv_output/NAME_IN_SNAKE_CASE_CV.pdf
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_png: true
  bold_keywords: []
